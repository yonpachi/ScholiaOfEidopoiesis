site_name: 錬金術TRPG
site_description: 錬金術TRPG ルールブック
site_url: https://yonpachi.github.io/ScholiaOfEidopoiesis/

repo_url: https://github.com/yonpachi/ScholiaOfEidopoiesis
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: ja
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - macros:
      module_name: macros

nav:
  - ホーム: index.md
  - 用語集: glossary.md
  - ルール:
    - rules/index.md
    - ダイスシステム: rules/dice.md
    - 種族・種族能力: rules/ancestry.md
